name: Deploy e diagnóstico no Kubernetes

on:
  push:
    branches: [main]
    paths: ["src/**", "k8s/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: k8s-agent
  cancel-in-progress: false

env:
  CLUSTER: k8s-agent-ci # nome próprio para não colidir com outros clusters kind da máquina
  IMAGE: demo-api:ci
  NAMESPACE: demo
  DEPLOYMENT: demo-api

jobs:
  deploy:
    # Variável de repositório RUNNER=self-hosted para rodar na sua máquina; sem ela, runner do GitHub.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false # o token do GitHub não fica no .git/config, ao alcance do agente

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Criar cluster kind
        run: |
          # Kubeconfig exclusivo desta execução: o ~/.kube/config da máquina nunca é tocado.
          echo "KUBECONFIG=$RUNNER_TEMP/kind-admin.kubeconfig" >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/kind-admin.kubeconfig"
          kind version
          kubectl version --client
          kind delete cluster --name "$CLUSTER" # sobra de uma execução cancelada (runner local)
          kind create cluster --name "$CLUSTER" --wait 120s

      - name: Build da imagem
        run: |
          docker build -t "$IMAGE" --build-arg APP_VERSION="${GITHUB_SHA::7}" src/Api
          kind load docker-image "$IMAGE" --name "$CLUSTER"

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          {
            kubectl apply -f k8s/
            kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s
          } 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # ---------- Daqui para baixo, só roda se o deploy falhou ----------

      - name: Kubeconfig somente leitura para o agente
        if: steps.deploy.outcome == 'failure'
        run: |
          .github/k8s-agent/readonly-kubeconfig.sh "$RUNNER_TEMP/agent-kubeconfig"
          # Remove o kubeconfig de administrador desta execução: o agente só enxerga o de leitura.
          # Ele é recriado com `kind export kubeconfig` na validação.
          rm -f "$KUBECONFIG"

      - name: Instalar Claude Code
        if: steps.deploy.outcome == 'failure'
        run: npm install -g @anthropic-ai/claude-code

      - name: Investigar com o Claude
        id: agent
        if: steps.deploy.outcome == 'failure'
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KUBECONFIG: ${{ runner.temp }}/agent-kubeconfig
          DEPLOY_LOG: ${{ runner.temp }}/deploy.log
        run: .github/k8s-agent/agent.sh

      - name: Validar a correção no cluster
        id: validate
        if: steps.deploy.outcome == 'failure' && steps.agent.outputs.changed == 'true'
        continue-on-error: true
        run: |
          kind export kubeconfig --name "$CLUSTER"
          docker build -t "$IMAGE" --build-arg APP_VERSION="${GITHUB_SHA::7}-fix" src/Api
          kind load docker-image "$IMAGE" --name "$CLUSTER"
          kubectl apply -f k8s/
          kubectl rollout restart "deployment/$DEPLOYMENT" -n "$NAMESPACE"
          kubectl rollout status "deployment/$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s

      - name: Abrir issue e pull request
        if: always() && steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION: ${{ steps.validate.outcome }}
        run: .github/k8s-agent/publish.sh

      - name: Apagar o cluster kind
        if: always()
        run: kind delete cluster --name "$CLUSTER"

      - name: Marcar o deploy como falho
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::error::O deploy falhou. Veja a issue aberta pelo agente."
          exit 1
