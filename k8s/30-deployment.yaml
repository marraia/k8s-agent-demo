apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: demo-api:ci
          imagePullPolicy: Never # a imagem é carregada no kind pelo workflow
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: demo-api-config
          env:
            - name: Pagamentos__ApiKey
              valueFrom:
                secretKeyRef:
                  name: demo-api-secrets
                  key: pagamentos-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          # Liveness: o processo responde? Nunca depende de banco, cache ou outra API.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness: pode receber tráfego? Aqui sim entram as dependências.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
